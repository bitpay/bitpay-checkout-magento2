name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'master'
        type: string
      version:
        description: 'Version number (e.g., 10.3.0)'
        required: true
        type: string
      overview:
        description: 'Release overview (will be placed at top of notes)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      
      - name: Validate version format
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ! echo "${VERSION_INPUT}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 10.3.0)"
            exit 1
          fi
          echo "version=${VERSION_INPUT}" >> $GITHUB_OUTPUT
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update version
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          # Update composer.json
          jq --arg version "${VERSION_OUTPUT}" '.version = $version' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json

          # Update Model/Client.php (line 45)
          sed -i.bak -E "s/BitPay_Magento2_v[0-9]+\.[0-9]+\.[0-9]+/BitPay_Magento2_v${VERSION_OUTPUT}/" Model/Client.php
          rm Model/Client.php.bak

          # Update Model/Config.php (line 32)
          sed -i.bak -E "s/Bitpay_BPCheckout_Magento2_[0-9]+\.[0-9]+\.[0-9]+/Bitpay_BPCheckout_Magento2_${VERSION_OUTPUT}/" Model/Config.php
          rm Model/Config.php.bak

          # Update etc/module.xml (line 9)
          sed -i.bak -E "s/setup_version=\"[0-9]+\.[0-9]+\.[0-9]+\"/setup_version=\"${VERSION_OUTPUT}\"/" etc/module.xml
          rm etc/module.xml.bak
      
      - name: Commit version update
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          git add composer.json Model/Client.php Model/Config.php etc/module.xml
          git commit -m "Bump version to ${VERSION_INPUT}"
          git push origin "${BRANCH_INPUT}"

          # Verify the commit was pushed successfully
          git fetch origin "${BRANCH_INPUT}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse "origin/${BRANCH_INPUT}")

          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Error: Local commit ${local_sha} was not successfully pushed to remote"
            echo "Remote is at: ${remote_sha}"
            echo "This may indicate branch protection blocked the push."
            exit 1
          fi

          echo "Commit ${local_sha} successfully pushed to origin/${BRANCH_INPUT}"
      
      - name: Create and push tag
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "${VERSION_OUTPUT}" >/dev/null 2>&1; then
            echo "Tag ${VERSION_OUTPUT} already exists"
          else
            git tag "${VERSION_OUTPUT}"
            git push origin "${VERSION_OUTPUT}"
          fi
          git push origin "${VERSION_OUTPUT}"
      
      - name: Get merged PR titles and format release notes
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ inputs.branch }}
          OVERVIEW_INPUT: ${{ inputs.overview }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_INPUT: ${{ inputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --tags

          # Get most recent and previous tags
          tags=($(git tag --sort=-creatordate))

          # Find the current version tag and get the previous one
          new_tag="$VERSION"
          prev_tag=""
          for i in "${!tags[@]}"; do
            if [[ "${tags[$i]}" == "$VERSION" ]]; then
              prev_tag="${tags[$((i+1))]}"
              break
            fi
          done

          if [ -z "$prev_tag" ]; then
            echo "Warning: No previous tag found. Skipping full changelog link."
            changelog=""
            commit_range="$new_tag"
            # Get all merged PRs
            prs=$(gh pr list --state merged --base "$BRANCH" --limit 100 --json title,mergedAt | jq '[.[] | select(.mergedAt != null) | .title]')
          else
            changelog="**Full Changelog**: https://github.com/$REPOSITORY/compare/$prev_tag...$new_tag"
            commit_range="$prev_tag..$new_tag"
            # Get date of previous tag
            prev_tag_date=$(git log -1 --format=%aI "$prev_tag")
            # Get PRs merged since the previous tag
            prs=$(gh pr list --state merged --base "$BRANCH" --limit 100 --json title,mergedAt | jq --arg date "$prev_tag_date" '[.[] | select(.mergedAt != null and .mergedAt > $date) | .title]')
          fi
          joined=$(echo "$prs" | jq -r '.[]' | sed 's/^/* /')

          # Fallback: if no PRs found, list commits
          if [ -z "$joined" ]; then
            joined=$(git log "$commit_range" --oneline --pretty=format:'* %s' | grep -v '^* Merge' || true)
          fi

          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "RELEASE_NOTES<<$DELIM"
            echo "${OVERVIEW_INPUT}"
            echo ""
            echo "## What's Changed"
            echo "$joined"
            echo ""
            echo "$changelog"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_TEXT: ${{ env.RELEASE_NOTES }}
        run: |
          if gh release view "${VERSION_OUTPUT}" >/dev/null 2>&1; then
            echo "Release ${VERSION_OUTPUT} already exists"
          else
            gh release create "${VERSION_OUTPUT}" \
              --title "${VERSION_OUTPUT}" \
              --notes "${RELEASE_NOTES_TEXT}"
          fi

  readme-changelog:
    name: Publish changelog to Readme
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Extract release data
        id: release_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "title=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          body=$(gh release view "${RELEASE_VERSION}" --json body --jq .body)
          body_escaped=$(echo "$body" \
            | sed 's/&/\&#38;/g' \
            | sed 's/</\&#60;/g' \
            | sed 's/>/\&#62;/g' \
            | sed 's/{/\&#123;/g' \
            | sed 's/}/\&#125;/g')
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            echo "$body_escaped"
            echo "$DELIM"
          } >> $GITHUB_OUTPUT

      - name: Publish changelog to Readme
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          RELEASE_TITLE: ${{ steps.release_data.outputs.title }}
          RELEASE_BODY: ${{ steps.release_data.outputs.body }}
        run: |
          jq -n --arg title "BitPay Checkout module for Magento 2 v${RELEASE_TITLE}" \
                --arg body "${RELEASE_BODY}" \
                '{
                  title: $title,
                  content: {
                    body: $body
                  },
                  privacy: { view: "public" }
                }' > payload.json

          curl --location 'https://api.readme.com/v2/changelogs' \
            --header "Authorization: Bearer ${README_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data @payload.json \
            --fail
