name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'master'
        type: string
      version:
        description: 'Version number (e.g., 10.3.0)'
        required: true
        type: string
      overview:
        description: 'Release overview (will be placed at top of notes)'
        required: true
        type: string

jobs:
  release:
    name: Create tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      
      - name: Validate version format
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ! echo "${VERSION_INPUT}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 10.3.0)"
            exit 1
          fi
          echo "version=${VERSION_INPUT}" >> $GITHUB_OUTPUT
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update version
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          # Update composer.json
          jq --arg version "${VERSION_OUTPUT}" '.version = $version' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json

          # Update Model/Client.php (line 45)
          sed -i.bak -E "s/BitPay_Magento2_v[0-9]+\.[0-9]+\.[0-9]+/BitPay_Magento2_v${VERSION_OUTPUT}/" Model/Client.php
          rm Model/Client.php.bak

          # Update Model/Config.php (line 32)
          sed -i.bak -E "s/Bitpay_BPCheckout_Magento2_[0-9]+\.[0-9]+\.[0-9]+/Bitpay_BPCheckout_Magento2_${VERSION_OUTPUT}/" Model/Config.php
          rm Model/Config.php.bak

          # Update etc/module.xml (line 9)
          sed -i.bak -E "s/setup_version=\"[0-9]+\.[0-9]+\.[0-9]+\"/setup_version=\"${VERSION_OUTPUT}\"/" etc/module.xml
          rm etc/module.xml.bak
      
      - name: Commit version update
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          git add composer.json Model/Client.php Model/Config.php etc/module.xml
          git commit -m "Bump version to ${VERSION_INPUT}"
          git push origin "${BRANCH_INPUT}"

          # Verify the commit was pushed successfully
          git fetch origin "${BRANCH_INPUT}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse "origin/${BRANCH_INPUT}")

          if [ "$local_sha" != "$remote_sha" ]; then
            echo "❌ Error: Local commit ${local_sha} was not successfully pushed to remote"
            echo "Remote is at: ${remote_sha}"
            echo "This may indicate branch protection blocked the push."
            exit 1
          fi

          echo "✓ Commit ${local_sha} successfully pushed to origin/${BRANCH_INPUT}"
      
      - name: Create and push tag
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          git tag "${VERSION_OUTPUT}"
          git push origin "${VERSION_OUTPUT}"
      
      - name: Get merged PR titles and format release notes
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_INPUT: ${{ inputs.branch }}
          OVERVIEW_INPUT: ${{ inputs.overview }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --tags

          # Get most recent and previous tags
          tags=($(git tag --sort=-creatordate))
          new_tag="${tags[0]}"
          prev_tag="${tags[1]}"

          if [ -z "$prev_tag" ]; then
            echo "Warning: No previous tag found. Using all commits."
            changelog=""
            commit_range="$new_tag"
          else
            changelog="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/$prev_tag...$new_tag"
            commit_range="$prev_tag..$new_tag"
          fi

          # Get PR numbers from commits between tags
          pr_numbers=$(git log "$commit_range" --merges --oneline --pretty=format:'%s' | grep -oE '#[0-9]+' | sed 's/#//' | sort -u)

          # Fetch PR titles for each PR number
          joined=""
          if [ -n "$pr_numbers" ]; then
            while IFS= read -r pr_num; do
              if [ -n "$pr_num" ]; then
                pr_title=$(gh pr view "$pr_num" --json title --jq .title 2>/dev/null || echo "PR #$pr_num")
                joined="${joined}* ${pr_title}"$'\n'
              fi
            done <<< "$pr_numbers"
          fi

          # Fallback: if no PRs found, list commits
          if [ -z "$joined" ]; then
            joined=$(git log "$commit_range" --oneline --pretty=format:'* %s' | grep -v '^* Merge')
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "${OVERVIEW_INPUT}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## What's Changed" >> $GITHUB_ENV
          echo "$joined" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$changelog" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_TEXT: ${{ env.RELEASE_NOTES }}
        run: |
          gh release create "${VERSION_OUTPUT}" \
            --title "${VERSION_OUTPUT}" \
            --notes "${RELEASE_NOTES_TEXT}"

  readme-changelog:
    name: Publish changelog to Readme
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Extract release data
        id: release_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "title=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          body=$(gh release view "${RELEASE_VERSION}" --json body --jq .body)
          body_escaped=$(echo "$body" \
            | sed 's/&/\&#38;/g' \
            | sed 's/</\&#60;/g' \
            | sed 's/>/\&#62;/g' \
            | sed 's/{/\&#123;/g' \
            | sed 's/}/\&#125;/g')
          {
            echo "body<<EOF"
            echo "$body_escaped"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish changelog to Readme
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          RELEASE_TITLE: ${{ steps.release_data.outputs.title }}
          RELEASE_BODY: ${{ steps.release_data.outputs.body }}
        run: |
          jq -n --arg title "BitPay Checkout module for Magento 2 v${RELEASE_TITLE}" \
                --arg body "${RELEASE_BODY}" \
                '{
                  title: $title,
                  content: {
                    body: $body
                  },
                  privacy: { view: "public" }
                }' > payload.json

          curl --location 'https://api.readme.com/v2/changelogs' \
            --header "Authorization: Bearer ${README_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data @payload.json \
            --fail
